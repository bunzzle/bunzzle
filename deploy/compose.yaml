name: bunzzle

x-role: &role
  image: ${BUNZZLE_IMAGE:-ghcr.io/bunzzle/bunzzle:latest}
  restart: unless-stopped
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  tmpfs: ["/tmp:size=16m,mode=1777"]
  env_file: [bunzzle.env]
  environment:
    BUNZZLE_RUN_DIR: /run/bunzzle

services:
  init:
    image: ${BUNZZLE_IMAGE:-ghcr.io/bunzzle/bunzzle:latest}
    user: "0:0"
    network_mode: none
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        chown 0:10010 /run/bunzzle && chmod 1770 /run/bunzzle &&
        chown 10011:10011 /var/lib/bunzzle/keys && chmod 0700 /var/lib/bunzzle/keys &&
        chown 10012:10012 /var/lib/bunzzle/data && chmod 0700 /var/lib/bunzzle/data
    volumes:
      - run:/run/bunzzle
      - keys:/var/lib/bunzzle/keys
      - data:/var/lib/bunzzle/data

  signer:
    <<: *role
    command: ["role", "signer"]
    user: "10011:10011"
    group_add: ["10010"]
    network_mode: none
    environment:
      BUNZZLE_RUN_DIR: /run/bunzzle
      BUNZZLE_KEYS_DIR: /var/lib/bunzzle/keys
      BUNZZLE_MASTER_KEY_FILE: /run/secrets/master_key
    secrets: [master_key]
    volumes:
      - run:/run/bunzzle
      - keys:/var/lib/bunzzle/keys
    healthcheck: &socket
      test: ["CMD", "/bin/sh", "-c", "test -S /run/bunzzle/signer.sock"]
      interval: 2s
      timeout: 2s
      retries: 30
    depends_on:
      init: { condition: service_completed_successfully }

  dns:
    <<: *role
    command: ["role", "dns"]
    user: "10016:10016"
    group_add: ["10010"]
    environment:
      BUNZZLE_RUN_DIR: /run/bunzzle
      BUNZZLE_CLOUDFLARE_API_TOKEN_FILE: /run/secrets/cloudflare_token
    secrets: [cloudflare_token]
    volumes:
      - run:/run/bunzzle
    healthcheck:
      <<: *socket
      test: ["CMD", "/bin/sh", "-c", "test -S /run/bunzzle/dns.sock"]

  core:
    <<: *role
    command: ["role", "core"]
    user: "10012:10012"
    group_add: ["10010", "10011", "10013", "10016"]
    network_mode: none
    environment:
      BUNZZLE_RUN_DIR: /run/bunzzle
      BUNZZLE_DATA_DIR: /var/lib/bunzzle/data
    volumes:
      - run:/run/bunzzle
      - data:/var/lib/bunzzle/data
    healthcheck:
      <<: *socket
      test: ["CMD", "/bin/sh", "-c", "test -S /run/bunzzle/core.sock"]
    depends_on:
      signer: { condition: service_healthy }
      dns: { condition: service_healthy }

  delivery:
    <<: *role
    command: ["role", "delivery"]
    user: "10013:10013"
    group_add: ["10010", "10011"]
    network_mode: host
    environment:
      BUNZZLE_RUN_DIR: /run/bunzzle
    volumes:
      - run:/run/bunzzle
    healthcheck:
      <<: *socket
      test: ["CMD", "/bin/sh", "-c", "test -S /run/bunzzle/delivery.sock"]
    depends_on:
      core: { condition: service_healthy }

  api:
    <<: *role
    command: ["role", "api"]
    user: "10014:10014"
    group_add: ["10010", "10012"]
    environment:
      BUNZZLE_RUN_DIR: /run/bunzzle
      BUNZZLE_HOST: 0.0.0.0
      BUNZZLE_PORT: "3000"
    ports: ["127.0.0.1:3000:3000"]
    volumes:
      - run:/run/bunzzle
    depends_on:
      delivery: { condition: service_healthy }

  inbound:
    <<: *role
    command: ["role", "inbound"]
    user: "10015:10015"
    group_add: ["10010", "10012"]
    environment:
      BUNZZLE_RUN_DIR: /run/bunzzle
      BUNZZLE_INBOUND_HOST: 0.0.0.0
      BUNZZLE_INBOUND_PORT: "2525"
    ports: ["${BUNZZLE_INBOUND_PUBLISH:-25}:2525"]
    volumes:
      - run:/run/bunzzle
    depends_on:
      core: { condition: service_healthy }

secrets:
  master_key:
    file: ./master.key
  cloudflare_token:
    file: ./cloudflare-token

volumes:
  run:
  keys:
  data:
