name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  binaries:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.3
      - uses: biomejs/setup-biome@4c91541eaada48f67d7dbd7833600ce162b68f51
        with:
          version: 2.5.15
      - run: bun install --frozen-lockfile
      - name: Tag matches package.json
        run: test "v$(jq -r .version package.json)" = "$GITHUB_REF_NAME"
      - run: bun run check
      - name: Build
        run: |
          mkdir -p release
          for target in linux-x64 linux-arm64 darwin-arm64 darwin-x64; do
            bun build src/cli/main.ts src/core/store/body-worker.ts --compile --minify --sourcemap \
              --target="bun-$target" --outfile "release/bunzzle-$target"
          done
          rm -f release/*.map
          ./release/bunzzle-linux-x64 --version
          cp deploy/install.sh release/install.sh
          tar -czf release/bunzzle-deploy.tar.gz deploy
      - uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c
        with:
          path: .
          format: spdx-json
          output-file: release/bunzzle.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c
        with:
          path: .
          format: cyclonedx-json
          output-file: release/bunzzle.cdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Checksums
        working-directory: release
        run: sha256sum bunzzle-* install.sh bunzzle.spdx.json bunzzle.cdx.json > SHA256SUMS
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6
      - name: Sign
        working-directory: release
        run: cosign sign-blob --yes --bundle SHA256SUMS.sigstore.json SHA256SUMS
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        if: ${{ !github.event.repository.private }}
        with:
          subject-checksums: release/SHA256SUMS
      - uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e
        if: ${{ !github.event.repository.private }}
        with:
          subject-path: |
            release/bunzzle-linux-*
            release/bunzzle-darwin-*
          sbom-path: release/bunzzle.spdx.json
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64
        with:
          draft: true
          files: release/*

  image:
    runs-on: ubuntu-latest
    needs: binaries
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    env:
      IMAGE: ghcr.io/${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          sbom: true
          provenance: mode=max
          tags: |
            ${{ env.IMAGE }}:${{ github.ref_name }}
            ${{ env.IMAGE }}:latest
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6
      - name: Sign
        run: cosign sign --yes "$IMAGE@${{ steps.build.outputs.digest }}"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        if: ${{ !github.event.repository.private }}
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  sdk:
    runs-on: ubuntu-latest
    needs: binaries
    environment: npm
    permissions:
      contents: read
      id-token: write
    container:
      image: node:24-alpine@sha256:44fce696f38ba8c987c4db89954051000bbd05ffd8d8659ba15ed4a8602e937f
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Tag matches the SDK version
        working-directory: sdk/typescript
        run: |
          test "v$(sed -n 's/^  "version": "\(.*\)",$/\1/p' package.json)" = "$GITHUB_REF_NAME"
      - name: Publish with trusted publishing and provenance
        working-directory: sdk/typescript
        run: npx --yes npm@11.20.0 publish --provenance
