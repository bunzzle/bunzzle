name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - uses: biomejs/setup-biome@v2
        with:
          version: 2.5.15
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run build
      - run: ./dist/bunzzle --version
