name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.3
      - uses: biomejs/setup-biome@4c91541eaada48f67d7dbd7833600ce162b68f51
        with:
          version: 2.5.15
      - run: bun install --frozen-lockfile
      - run: bun run check
        env:
          BUNZZLE_FUZZ_ITERATIONS: "5000"
          BUNZZLE_FUZZ_SEED: ${{ github.run_id }}
      - run: bun run build
      - run: ./dist/bunzzle --version

  sdk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.3
      - name: Pack
        working-directory: sdk/typescript
        run: |
          mkdir -p "$RUNNER_TEMP/sdk"
          bun pm pack --destination "$RUNNER_TEMP/sdk"
          tar -xzf "$RUNNER_TEMP"/sdk/*.tgz -C "$RUNNER_TEMP/sdk"
          test "$(cd "$RUNNER_TEMP/sdk/package" && ls | LC_ALL=C sort | tr '\n' ' ')" = "CHANGELOG.md LICENSE README.md index.d.ts index.js package.json "
      - name: The packed SDK works
        run: bun sdk/smoke.mjs "$RUNNER_TEMP/sdk/package/index.js"
      - name: Publish dry run
        working-directory: sdk/typescript
        env:
          NPM_CONFIG_TOKEN: dry-run
        run: bun publish --dry-run --access public

  system:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BUNZZLE_E2E_DNS_PORT: "5354"
      BUNZZLE_E2E_MX_PORT: "2526"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.3
      - run: bun install --frozen-lockfile
      - run: bun run build
      - name: Install with systemd
        run: |
          sudo ./deploy/install.sh dist/bunzzle
          sudo tee -a /etc/bunzzle/bunzzle.env >/dev/null <<EOF
          BUNZZLE_EHLO_NAME=mail.bunzzle.test
          BUNZZLE_DNS_SERVERS=127.0.0.1:5354
          BUNZZLE_SMTP_PORT=2526
          BUNZZLE_ALLOW_PRIVATE_DESTINATIONS=true
          EOF
          sudo systemctl restart bunzzle.target
          sleep 3
          systemctl --no-pager status 'bunzzle-*'
      - name: Send end to end through the systemd units
        run: sudo -E env "PATH=$PATH" BUNZZLE_E2E_CLI=/usr/local/bin/bunzzle bun test/system/e2e.ts
      - name: Kill core and signer, send again
        run: |
          sudo kill -9 "$(systemctl show -p MainPID --value bunzzle-core)" "$(systemctl show -p MainPID --value bunzzle-signer)"
          sleep 5
          sudo -E env "PATH=$PATH" BUNZZLE_E2E_CLI=/usr/local/bin/bunzzle bun test/system/e2e.ts
      - name: Sandbox exposure
        run: for r in signer dns core delivery api inbound; do systemd-analyze security "bunzzle-$r.service" --no-pager | tail -1; done
      - name: Firewall rules load
        run: |
          command -v nft >/dev/null || sudo apt-get install -qq -y nftables
          sudo nft -f deploy/nftables/bunzzle.nft
          sudo nft add element inet bunzzle core4 '{ 203.0.113.5 }'
          sudo nft add element inet bunzzle link_ports '{ 7465 }'
          sudo nft add element inet bunzzle node_links4 '{ 198.51.100.7 . 7465 }'
          sudo nft delete table inet bunzzle
      - name: Journal
        if: failure()
        run: sudo journalctl -u 'bunzzle-*' --no-pager | tail -200
      - run: sudo systemctl stop bunzzle.target
      - run: docker build -t bunzzle:ci .
      - name: Send end to end through one container
        run: |
          docker run -d --name bz --network host --read-only --cap-drop ALL \
            --security-opt no-new-privileges:true \
            --tmpfs /run/bunzzle:uid=10001,gid=10001,mode=0750 -v bzdata:/var/lib/bunzzle \
            -e BUNZZLE_HOST=127.0.0.1 -e BUNZZLE_MASTER_KEY="$(docker run --rm bunzzle:ci master-key)" \
            -e BUNZZLE_DNS_SERVERS=127.0.0.1:5354 -e BUNZZLE_SMTP_PORT=2526 \
            -e BUNZZLE_ALLOW_PRIVATE_DESTINATIONS=true -e BUNZZLE_EHLO_NAME=mail.bunzzle.test \
            bunzzle:ci
          sleep 5
          BUNZZLE_E2E_CLI="docker exec bz bunzzle" bun test/system/e2e.ts
          docker rm -f bz
      - name: Send end to end through five containers
        working-directory: deploy
        run: |
          docker run --rm bunzzle:ci master-key > master.key
          : > cloudflare-token
          chmod 0444 master.key cloudflare-token
          printf 'BUNZZLE_EHLO_NAME=mail.bunzzle.test\nBUNZZLE_DNS_SERVERS=127.0.0.1:5354\nBUNZZLE_SMTP_PORT=2526\nBUNZZLE_ALLOW_PRIVATE_DESTINATIONS=true\n' >> bunzzle.env
          BUNZZLE_IMAGE=bunzzle:ci BUNZZLE_INBOUND_PUBLISH=2525 docker compose up -d --wait
          BUNZZLE_E2E_CLI="docker compose -f $PWD/compose.yaml exec -T core bunzzle" bun ../test/system/e2e.ts
      - name: Container logs
        if: failure()
        working-directory: deploy
        run: docker compose logs --no-color | tail -200
