name: Bench

on:
  workflow_dispatch:
    inputs:
      cases:
        description: Cases to run
        default: base medium large
      emails:
        description: Emails per case
        default: "10000"
      destinations:
        description: Destinations
        default: "1000"

permissions:
  contents: read

jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.3
      - run: bun install --frozen-lockfile
      - name: Machine
        run: |
          {
            echo '```'
            echo "cores: $(nproc)"
            grep -m1 'model name' /proc/cpuinfo
            free -m | head -2
            echo "bunzzle $(git rev-parse --short HEAD), bun $(bun --version)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Run
        env:
          CASES: ${{ inputs.cases }}
          EMAILS: ${{ inputs.emails }}
          DESTINATIONS: ${{ inputs.destinations }}
        run: |
          set -o pipefail
          status=0
          for c in $CASES; do
            {
              echo "## $c"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            timeout 900 bun bench/realistic.ts "$c" "$EMAILS" "$DESTINATIONS" | tee -a "$GITHUB_STEP_SUMMARY" || status=1
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          done
          exit $status
